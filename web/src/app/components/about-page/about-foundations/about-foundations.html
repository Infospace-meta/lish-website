<section
  appScrollReveal
  class="py-20 sm:py-32 bg-white border-t border-black/5 overflow-hidden"
>
  <div class="max-w-7xl mx-auto px-6 sm:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-20 items-end">
      <div class="reveal-text delay-1">
        <span
          class="inline-block text-[10px] sm:text-[11px] font-bold uppercase tracking-[0.25em] text-accent mb-6"
          >Foundations</span
        >
        <h2
          class="text-4xl sm:text-5xl lg:text-6xl font-medium leading-[0.95] tracking-tight text-primary"
        >
          Built on a <br />
          <span
            class="text-accent underline decoration-accent underline-offset-8"
            >purpose-driven</span
          >
          core.
        </h2>
      </div>
      <div class="reveal-text delay-2">
        <p
          class="text-text-muted text-lg sm:text-xl font-light leading-relaxed max-w-md"
        >
          Lish AI Labs isn't just a workspace; it is a movement designed to
          redefine how the global industry interacts with talent.
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 sm:gap-12">
      <div
        *ngFor="let pillar of pillars; let i = index"
        class="group relative p-8 sm:p-10 bg-warm-bg rounded-3xl border border-black/[0.03] transition-all duration-700 hover:shadow-2xl hover:-translate-y-2 reveal-text"
        [style.animation-delay]="(0.3 + (i * 0.15)) + 's'"
      >
        <div class="mb-10 flex justify-between items-start">
          <div
            class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm group-hover:bg-primary group-hover:text-white transition-colors duration-500"
          >
            <span class="material-symbols-outlined text-[24px]"
              >{{pillar.icon}}</span
            >
          </div>
          <span
            class="text-[10px] font-bold uppercase tracking-widest text-primary/30 group-hover:text-accent transition-colors"
            >0{{i+1}}</span
          >
        </div>

        <div class="space-y-4">
          <span
            class="text-[11px] font-bold uppercase tracking-[0.2em] text-accent"
            >{{pillar.label}}</span
          >
          <h3 class="text-2xl font-medium leading-tight text-primary">
            {{pillar.title}}
          </h3>
          <p class="text-text-muted font-light leading-relaxed">
            {{pillar.desc}}
          </p>
        </div>

        <div
          class="absolute bottom-0 right-0 p-4 opacity-[0.03] group-hover:opacity-[0.08] transition-opacity"
        >
          <span class="material-symbols-outlined text-8xl rotate-12"
            >architecture</span
          >
        </div>
      </div>
    </div>
  </div>
</section>
