<div
  class="group bg-white rounded-2xl overflow-hidden border border-black/5 flex flex-col h-full transition-shadow duration-300"
>
  @if (imageUrl) {
  <div class="relative w-full flex-[2] min-h-0 overflow-hidden bg-soft-grey">
    <img
      [src]="imageUrl"
      [alt]="imageAlt"
      class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
    />
    <div
      class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"
    ></div>
  </div>
  }
  <div class="p-7 pb-2 flex flex-col flex-1 min-h-0">
    <div class="flex items-center justify-between mb-5">
      <h5 class="text-complement">
        {{ index }}
      </h5>
      <div
        class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center"
      >
         <span class="material-symbols-outlined text-accent text-xl">{{
          icon
        }}</span>
      </div>
    </div>
    <p class="text-2xl text-accent">{{ title }}</p>
    <p class="">{{ description }}</p>
  </div>
</div>
