<div class="bg-white rounded-2xl overflow-hidden border border-black/5">
  @if (imageUrl) {
  <div class="w-full aspect-[16/9] bg-soft-grey overflow-hidden">
    <img [src]="imageUrl" [alt]="imageAlt" class="w-full h-full object-cover" />
  </div>
  }
  <div class="p-10 space-y-4">
    <div class="flex items-center gap-4">
      <h5
        class="text-complement"
      >
        {{ index }}
      </h5>
      <div
        class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center"
      >
        <span class="material-symbols-outlined text-accent text-xl">{{
          icon
        }}</span>
      </div>
    </div>
    <p class="text-2xl text-accent">{{ title }}</p>
    <p class="">{{ description }}</p>
  </div>
</div>
